<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode 45 贪心算法可视化</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --border-color: #333;
            --highlight-bg: #37373d;
            --active-line: #062f4a;
            --primary: #007acc;
            --danger: #f14c4c;
            --success: #4cca5a;
            --warning: #cca700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 左侧动态讲解 */
        .left-panel {
            flex: 6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border-color);
            background-color: var(--panel-bg);
            box-sizing: border-box;
        }

        /* 右侧代码 */
        .right-panel {
            flex: 4;
            background-color: #1e1e1e;
            padding: 0;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .code-container {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 20px 0;
        }

        .code-line {
            padding: 2px 20px;
            white-space: pre;
            display: flex;
            border-left: 4px solid transparent;
        }

        .code-line.active {
            background-color: var(--active-line);
            border-left-color: var(--primary);
        }

        .line-num {
            color: #858585;
            margin-right: 15px;
            user-select: none;
            width: 20px;
            text-align: right;
        }

        /* 可视化组件 */
        .array-container {
            display: flex;
            margin: 40px 0 60px 0;
            position: relative;
            padding: 0 20px;
        }

        .array-cell {
            width: 60px;
            height: 60px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 24px;
            font-weight: bold;
            position: relative;
            background-color: #2d2d2d;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .cell-index {
            font-size: 12px;
            color: #888;
            position: absolute;
            bottom: -25px;
        }

        /* 指针标识 */
        .pointer-i {
            position: absolute;
            top: -35px;
            font-size: 14px;
            color: var(--primary);
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
            width: 60px;
        }

        .pointer-i::after {
            content: '↓';
            display: block;
            font-size: 18px;
        }

        /* 边界线 */
        .boundary-line {
            position: absolute;
            top: -10px;
            bottom: -30px;
            width: 2px;
            z-index: 10;
            transition: left 0.3s;
        }

        .boundary-current {
            background-color: var(--danger);
        }
        
        .boundary-current::after {
            content: 'current_end';
            position: absolute;
            bottom: -20px;
            left: 5px;
            color: var(--danger);
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .boundary-farthest {
            background-color: var(--success);
            border-left: 2px dashed var(--success);
            background: none;
        }

        .boundary-farthest::after {
            content: 'farthest';
            position: absolute;
            top: -20px;
            left: 5px;
            color: var(--success);
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 变量面板 */
        .vars-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .var-box {
            flex: 1;
            text-align: center;
        }

        .var-name {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .var-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--warning);
        }

        /* 讲解框 */
        .explanation-box {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 20px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #005f9e;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .step-counter {
            text-align: center;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <h2>图解：跳跃游戏 II（区间推进）</h2>
        
        <div class="vars-panel">
            <div class="var-box">
                <div class="var-name">steps (跳跃次数)</div>
                <div class="var-value" id="val-steps">0</div>
            </div>
            <div class="var-box">
                <div class="var-name">current_end (当前跳截止线)</div>
                <div class="var-value" id="val-end" style="color: var(--danger)">0</div>
            </div>
            <div class="var-box">
                <div class="var-name">farthest (最远探照边界)</div>
                <div class="var-value" id="val-far" style="color: var(--success)">0</div>
            </div>
        </div>

        <div class="array-container" id="array-container">
            <!-- 数组动态生成 -->
            <div class="boundary-line boundary-current" id="line-end" style="left: 70px;"></div>
            <div class="boundary-line boundary-farthest" id="line-far" style="left: 70px;"></div>
        </div>

        <div class="explanation-box" id="explanation">
            点击“下一步”开始执行代码。
        </div>

        <div class="step-counter" id="step-counter">步骤: 0 / 0</div>
        
        <div class="controls">
            <button id="btn-prev" disabled>上一步</button>
            <button id="btn-next">下一步</button>
            <button id="btn-reset">重置</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="code-container" id="code-container">
            <!-- 代码动态生成 -->
        </div>
    </div>
</div>

<script>
    // Python 代码文本
    const codeLines = [
        "class Solution:",
        "    def jump(self, nums: list[int]) -> int:",
        "        n = len(nums)",
        "        if n == 1:",
        "            return 0",
        "",
        "        steps = 0",
        "        current_end = 0",
        "        farthest = 0",
        "",
        "        for i in range(n - 1):",
        "            farthest = max(farthest, i + nums[i])",
        "",
        "            if i == current_end:",
        "                steps += 1",
        "                current_end = farthest",
        "",
        "        return steps"
    ];

    const nums = [2, 3, 1, 1, 4];
    const CELL_WIDTH = 70; // 60px width + 10px margin

    // 状态流帧 (每一帧代表一步代码的执行状态)
    const states = [
        {
            line: 6, i: -1, steps: 0, end: 0, far: 0,
            msg: "<b>初始化：</b><br>我们站在起点 (下标0)。<br>还没跳过，所以跳跃次数 <code>steps = 0</code>。<br>当前这一跳能覆盖的最远边界 <code>current_end = 0</code>。"
        },
        {
            line: 10, i: 0, steps: 0, end: 0, far: 0,
            msg: "<b>进入循环 <code>i = 0</code>：</b><br>当前站在位置 0，它的值是 2（意味着最多能往右跳2步）。"
        },
        {
            line: 11, i: 0, steps: 0, end: 0, far: 2,
            msg: "<b>探测最远点：</b><br>如果在位置 0 起跳，最远能到下标 <code>0 + 2 = 2</code>。<br>更新探测边界 <code>farthest = 2</code>。<br><i>（注意：此时我们还没正式跳，只是看好了下一跳的潜力）</i>"
        },
        {
            line: 13, i: 0, steps: 0, end: 0, far: 2,
            msg: "<b>检查是否到了截止线：</b><br>当前位置 <code>i(0) == current_end(0)</code>！<br>这说明我们已经走到了“当前这一跳”的尽头，没路了，<b>必须得跳一次了</b>！"
        },
        {
            line: 14, i: 0, steps: 1, end: 0, far: 2,
            msg: "<b>正式跳跃！</b><br>因为不得不跳，所以跳跃次数 <code>steps += 1</code> (变成 1)。"
        },
        {
            line: 15, i: 0, steps: 1, end: 2, far: 2,
            msg: "<b>刷新截止线：</b><br>既然跳了，那我们就用刚才探测到的最远距离，作为新的一跳的边界。<br><code>current_end</code> 被更新为 <code>farthest (2)</code>。"
        },
        {
            line: 10, i: 1, steps: 1, end: 2, far: 2,
            msg: "<b>进入循环 <code>i = 1</code>：</b><br>往前走一步。注意，此时 <code>i(1)</code> 还在截止线 <code>current_end(2)</code> 之内，说明我们仍在“第一跳”的覆盖范围内。"
        },
        {
            line: 11, i: 1, steps: 1, end: 2, far: 4,
            msg: "<b>探测最远点：</b><br>位置 1 的值是 3。如果从这里跳，最远能到 <code>1 + 3 = 4</code>。<br>比之前的 2 更远！更新探测边界 <code>farthest = 4</code>。"
        },
        {
            line: 13, i: 1, steps: 1, end: 2, far: 4,
            msg: "<b>检查是否到了截止线：</b><br>当前位置 <code>i(1) != current_end(2)</code>。<br>还没到这跳的尽头，不需要跳。继续往前走即可。"
        },
        {
            line: 10, i: 2, steps: 1, end: 2, far: 4,
            msg: "<b>进入循环 <code>i = 2</code>：</b><br>继续往前走。"
        },
        {
            line: 11, i: 2, steps: 1, end: 2, far: 4,
            msg: "<b>探测最远点：</b><br>位置 2 的值是 1，最远能到 <code>2 + 1 = 3</code>。<br>不如刚才探测到的 4 远，所以 <code>farthest</code> 保持 4 不变。"
        },
        {
            line: 13, i: 2, steps: 1, end: 2, far: 4,
            msg: "<b>检查是否到了截止线：</b><br>当前位置 <code>i(2) == current_end(2)</code>！<br>注意！我们又走到了边界！上一跳的范围到头了，<b>必须再跳一次</b>！"
        },
        {
            line: 14, i: 2, steps: 2, end: 2, far: 4,
            msg: "<b>正式跳跃！</b><br>跳跃次数 <code>steps += 1</code> (变成 2)。"
        },
        {
            line: 15, i: 2, steps: 2, end: 4, far: 4,
            msg: "<b>刷新截止线：</b><br>用刚才物色到的最远距离 4 作为新的边界。<br><code>current_end</code> 更新为 <code>farthest (4)</code>。"
        },
        {
            line: 10, i: 3, steps: 2, end: 4, far: 4,
            msg: "<b>进入循环 <code>i = 3</code>：</b><br>往前走，我们在新的截止线(4)以内。"
        },
        {
            line: 11, i: 3, steps: 2, end: 4, far: 4,
            msg: "<b>探测最远点：</b><br>位置 3 的值是 1，能到 <code>3 + 1 = 4</code>。<code>farthest</code> 保持 4。"
        },
        {
            line: 13, i: 3, steps: 2, end: 4, far: 4,
            msg: "<b>检查是否到了截止线：</b><br><code>i(3) != current_end(4)</code>。<br>还没到尽头，不用跳。"
        },
        {
            line: 17, i: 3, steps: 2, end: 4, far: 4,
            msg: "<b>循环结束：</b><br>我们只遍历到倒数第二个元素 (<code>i < n-1</code>)。<br>因为只要到了最后一个元素，就意味着已经到了终点，不需要再跳了。<br>最终返回 <code>steps = 2</code>。"
        }
    ];

    let currentState = 0;

    // 初始化 UI
    function init() {
        // 生成代码
        const codeContainer = document.getElementById('code-container');
        codeLines.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'code-line';
            div.id = `line-${index}`;
            div.innerHTML = `<span class="line-num">${index + 1}</span><span>${line}</span>`;
            codeContainer.appendChild(div);
        });

        // 生成数组
        const arrayContainer = document.getElementById('array-container');
        
        // 生成指针
        const pointer = document.createElement('div');
        pointer.className = 'pointer-i';
        pointer.id = 'pointer-i';
        pointer.style.left = '20px';
        pointer.style.display = 'none';
        pointer.innerText = 'i';
        arrayContainer.appendChild(pointer);

        nums.forEach((val, index) => {
            const cell = document.createElement('div');
            cell.className = 'array-cell';
            cell.innerText = val;
            
            const idx = document.createElement('div');
            idx.className = 'cell-index';
            idx.innerText = index;
            cell.appendChild(idx);
            
            arrayContainer.appendChild(cell);
        });

        renderState(0);
    }

    function renderState(index) {
        const state = states[index];
        
        // 更新变量
        document.getElementById('val-steps').innerText = state.steps;
        document.getElementById('val-end').innerText = state.end;
        document.getElementById('val-far').innerText = state.far;
        
        // 更新讲解
        document.getElementById('explanation').innerHTML = state.msg;
        document.getElementById('step-counter').innerText = `步骤: ${index} / ${states.length - 1}`;

        // 更新代码高亮
        document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
        if (state.line >= 0) {
            document.getElementById(`line-${state.line}`).classList.add('active');
            // 自动滚动代码区域
            document.getElementById(`line-${state.line}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 更新可视化图形
        const pointer = document.getElementById('pointer-i');
        if (state.i >= 0) {
            pointer.style.display = 'block';
            pointer.style.left = `${20 + state.i * CELL_WIDTH}px`;
        } else {
            pointer.style.display = 'none';
        }

        // 更新边界线 (左侧基础偏移 20px，每个格子宽 60+margin 10 = 70px)
        // 边界线画在格子右侧边缘
        const endLine = document.getElementById('line-end');
        endLine.style.left = `${20 + state.end * CELL_WIDTH + 60}px`;

        const farLine = document.getElementById('line-far');
        farLine.style.left = `${20 + state.far * CELL_WIDTH + 60}px`;

        // 按钮状态
        document.getElementById('btn-prev').disabled = index === 0;
        document.getElementById('btn-next').disabled = index === states.length - 1;
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        if (currentState < states.length - 1) {
            currentState++;
            renderState(currentState);
        }
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentState > 0) {
            currentState--;
            renderState(currentState);
        }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        currentState = 0;
        renderState(currentState);
    });

    // 启动
    window.onload = init;
</script>

</body>
</html>
